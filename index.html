<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <title>Login form</title>
</head>
<body>
    <form id="form" autocomplete="on">
        <div class="container">
            <h2>Login to your account</h2>
            <span></span>
        </div>
        <div class="container">
            <label for="txt" class="txtl">Name: </label>
        <input type="text" placeholder="ENTER YOUR NAME" id="txt" class="txt">
        </div>
         <div class="container">
            <label for="email" class="lab_email">Email: </label>
        <input type="email"placeholder="ENTER YOUR EMAIL" autocomplete="on" id="email">
        </div>
         <div class="container">
            <label for="pin_label" class="">Password: </label>
        <input type="password"placeholder="ENTER YOUR PASSWORD" autocomplete="on" id="pin">
        </div>
        <div class="container">
            <button class="btn">Login </button>
        </div>
    </form>
</body>
</html>
